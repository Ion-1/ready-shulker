name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
      changelog:
        description: "Release changelog"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "microsoft"

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build

      - name: package release jar
        id: package
        run: |
          MC_VERSION="$(jq -r '.depends.minecraft' src/main/resources/fabric.mod.json | tr -d '~')"
          echo "minecraft_version=$MC_VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p release
          mapfile -t jars < <(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar')
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected one release JAR, found ${#jars[@]}" >&2
            exit 1
          fi
          cp "${jars[0]}" "release/${{ github.event.repository.name }}-${{ inputs.tag }}+${MC_VERSION}.jar"

      - name: create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body: ${{ inputs.changelog }}
          files: release/*.jar

      - name: publish to Modrinth
        uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ vars.MODRINTH_PROJECT_ID }}
          name: ${{ inputs.tag }}
          version: ${{ inputs.tag }}
          changelog: ${{ inputs.changelog }}
          loaders: fabric
          game-versions: ${{ steps.package.outputs.minecraft_version }}
          files: release/${{ github.event.repository.name }}-${{ inputs.tag }}+${{ steps.package.outputs.minecraft_version }}.jar
